name: Reproducibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python scripts/reproduce.py
      - name: Test Excel verifier without claiming native Excel validation
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\verify_excel.ps1 -SelfTest
      - name: Check generated snapshots match the checkout
        run: git diff --exit-code -- data/processed dist docs sql outputs/build_manifest.json outputs/scenarios.csv outputs/powerbi bi/ThirstyAI_Data.m
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: thirstyai_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-local-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: thirstyai_db
      PGUSER: postgres
      PGPASSWORD: ci-local-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - run: python scripts/reproduce.py
      - run: python scripts/verify_postgres.py --load
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned audit CLI
        run: npm ci --prefix ci --ignore-scripts --no-audit --no-fund
      - name: Exercise browser interactions and capture screenshots
        run: node ci/browser-test.mjs
      - name: Audit with explicit Chrome readiness and bounded processes
        run: python scripts/audit_site.py --lighthouse-cli ci/node_modules/lighthouse/cli/index.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lighthouse-reports
          path: |
            outputs/lighthouse-*
            outputs/browser/
          if-no-files-found: warn
