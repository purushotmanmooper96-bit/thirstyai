name: Reproducibility
on: [push, pull_request]
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/reproduce.py
      - name: Test Excel verifier without claiming native Excel validation
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\verify_excel.ps1 -SelfTest
      - name: Check generated snapshots match the checkout
        run: git diff --exit-code -- data/processed dist docs sql outputs/build_manifest.json outputs/scenarios.csv
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: thirstyai_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-local-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: thirstyai_db
      PGUSER: postgres
      PGPASSWORD: ci-local-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - run: python scripts/reproduce.py
      - run: python scripts/verify_postgres.py --load
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned audit CLI
        run: npm install --prefix .ci-tools --no-package-lock --no-save lighthouse@12.8.2
      - name: Audit with explicit Chrome readiness and bounded processes
        run: python scripts/audit_site.py --lighthouse-cli .ci-tools/node_modules/lighthouse/cli/index.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: outputs/lighthouse-*
          if-no-files-found: warn
